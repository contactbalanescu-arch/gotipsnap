<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TipSnap - Fast & Easy Tip Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            width: 100%;
            max-width: 380px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
        }
        .logo span { color: #2563eb; }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .tip-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 10px 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .tip-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .results {
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
        .res-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .res-row:last-child {
            margin-bottom: 0;
            font-weight: 700;
            border-top: 1px dashed #e2e8f0;
            padding-top: 8px;
            color: #16a34a;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">⚡ Tip<span>Snap</span></div>
        
        <div class="input-group">
            <label for="bill">Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label>Select Tip %</label>
            <div class="tip-buttons">
                <button class="tip-btn" data-pct="10">10%</button>
                <button class="tip-btn active" data-pct="15">15%</button>
                <button class="tip-btn" data-pct="18">18%</button>
                <button class="tip-btn" data-pct="20">20%</button>
            </div>
            <input type="number" id="custom-tip" placeholder="Custom Tip %" min="0">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" value="1" min="1">
        </div>

        <div class="results">
            <div class="res-row"><span>Tip Amount:</span> <span id="tip-amount">$0.00</span></div>
            <div class="res-row"><span>Total Bill:</span> <span id="total-bill">$0.00</span></div>
            <div class="res-row"><span>Per Person:</span> <span id="per-person">$0.00</span></div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const customTipInput = document.getElementById('custom-tip');
        const peopleInput = document.getElementById('people');
        const tipButtons = document.querySelectorAll('.tip-btn');
        
        const tipAmountDisplay = document.getElementById('tip-amount');
        const totalBillDisplay = document.getElementById('total-bill');
        const perPersonDisplay = document.getElementById('per-person');

        let activeTipPercent = 15;

        // Calcul logic
        function calculate() {
            const bill = parseFloat(billInput.value) || 0;
            const people = Math.max(1, parseInt(peopleInput.value) || 1);
            
            // Determină procentul de bacșiș (buton sau custom)
            let tipPercent = activeTipPercent;
            if (customTipInput.value !== '') {
                tipPercent = parseFloat(customTipInput.value) || 0;
            }

            const tipAmount = bill * (tipPercent / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            // Afișare rezultate
            tipAmountDisplay.innerText = `$${tipAmount.toFixed(2)}`;
            totalBillDisplay.innerText = `$${totalBill.toFixed(2)}`;
            perPersonDisplay.innerText = `$${perPerson.toFixed(2)}`;
        }

        // Evenimente butoane procentuale
        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTipPercent = parseFloat(btn.getAttribute('data-pct'));
                customTipInput.value = ''; // Resetează custom dacă se apasă pe buton predefinit
                calculate();
            });
        });

        // Eveniment pentru input custom (dezactivează vizual butoanele)
        customTipInput.addEventListener('input', () => {
            tipButtons.forEach(b => b.classList.remove('active'));
            calculate();
        });

        // Ascultă modificările în timp real
        billInput.addEventListener('input', calculate);
        peopleInput.addEventListener('input', calculate);
    </script>
</body>
</html>
