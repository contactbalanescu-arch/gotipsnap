<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator & Split Bill Tool | TipSnap</title>
    <meta name="description" content="Calculate restaurant tips and split bills instantly with friends. No ads, mobile-friendly, and completely free.">
    <style>
        :root {
            --bg-main: #f8fafc; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #475569;
            --border-color: #e2e8f0; --btn-bg: #f1f5f9; --btn-active-bg: #e2e8f0;
            --primary: #2563eb; --primary-light: #dbeafe; --primary-text: #ffffff;
            --primary-strong: #1d4ed8; --primary-strong-text: #ffffff;
            --accent: #15803d; --display-bg: #f8fafc; --danger: #b91c1c; --danger-text: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }
        [data-theme="dark"] {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --btn-bg: #334155; --btn-active-bg: #475569;
            --primary: #3b82f6; --primary-light: #1e3a8a; --primary-text: #ffffff;
            --primary-strong: #1d4ed8; --primary-strong-text: #ffffff;
            --accent: #22c55e; --display-bg: #0f172a; --danger: #b91c1c; --danger-text: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; transition: background 0.2s, color 0.2s; user-select: none; -webkit-user-select: none; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: 22px; font-weight: 800; } .logo span { color: var(--primary); }
        .theme-toggle { background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .app-container { width: 100%; max-width: 400px; background-color: var(--bg-card); border-radius: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .displays-grid { background: var(--display-bg); border-radius: 16px; padding: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; justify-content: space-between; align-items: baseline; }
        .input-label { font-size: 13px; font-weight: 700; color: var(--text-muted); border: none; background: transparent; cursor: pointer; padding: 6px 8px; border-radius: 8px; text-align: left; }
        .input-label:active { background: var(--btn-active-bg); }
        .input-row.active .input-label { color: var(--primary-strong-text); background: var(--primary-strong); }
        .input-value { font-size: 28px; font-weight: 800; }
        .results-row { display: flex; gap: 10px; margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
        .res-box { flex: 1; background: var(--bg-card); padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); }
        .res-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .res-amount { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: 2px; }
        .keyboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button.k-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 14px 0; font-size: 18px; font-weight: 700; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        button.k-btn:active { background: var(--btn-active-bg); }
        button.k-btn.action-btn { background: var(--primary-strong); color: var(--primary-strong-text); }
        button.k-btn.clear-btn { background: var(--danger); color: var(--danger-text); }
        .double-width { grid-column: span 2; }
        .seo-section, .ad-space { width: 100%; max-width: 400px; margin-top: 16px; padding: 14px; border-radius: 16px; font-size: 12px; line-height: 1.5; }
        .seo-section { color: var(--text-muted); border: 1px solid var(--border-color); }
        .ad-space { background: var(--btn-bg); text-align: center; }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="logo">Tip<span>Snap</span></div>
            <button class="theme-toggle" id="themeToggle">☀️ Light</button>
        </header>
        <div class="app-container">
            <div class="displays-grid">
                <div class="input-row active" id="rowBill" style="border-left: 3px solid var(--primary); padding-left: 8px;">
                    <button class="input-label" id="tabBill" data-mode="bill">Bill Total:</button> <span class="input-value" id="displayBill">$0</span>
                </div>
                <div class="input-row" id="rowTip" style="padding-left: 8px;">
                    <button class="input-label" id="tabTip" data-mode="tip">Tip Percent:</button> <span class="input-value" id="displayTip">15%</span>
                </div>
                <div class="input-row" id="rowSplit" style="padding-left: 8px;">
                    <button class="input-label" id="tabSplit" data-mode="split">People:</button> <span class="input-value" id="displaySplit">1</span>
                </div>
                <div class="results-row">
                    <div class="res-box"><div class="res-label">Tip / Person</div><div class="res-amount" id="resTip">$0.00</div></div>
                    <div class="res-box"><div class="res-label">Total / Person</div><div class="res-amount" id="resTotal">$0.00</div></div>
                </div>
            </div>
            <div class="keyboard">
                <button class="k-btn action-btn" data-val="t10">10%</button>
                <button class="k-btn action-btn" data-val="t15">15%</button>
                <button class="k-btn action-btn" data-val="t18">18%</button>
                <button class="k-btn action-btn" data-val="t20">20%</button>
                <button class="k-btn" data-val="7">7</button>
                <button class="k-btn" data-val="8">8</button>
                <button class="k-btn" data-val="9">9</button>
                <button class="k-btn clear-btn" data-val="C">C</button>
                <button class="k-btn" data-val="4">4</button>
                <button class="k-btn" data-val="5">5</button>
                <button class="k-btn" data-val="6">6</button>
                <button class="k-btn" data-val="back">⌫</button>
                <button class="k-btn" data-val="1">1</button>
                <button class="k-btn" data-val="2">2</button>
                <button class="k-btn" data-val="3">3</button>
                <button class="k-btn" data-val="0">0</button>
                <button class="k-btn double-width" data-val=".">.</button>
            </div>
        </div>
        <section class="seo-section">
            <h2>Why Use Our Free Tip Calculator?</h2>
            <p>Using TipSnap is simple. Just enter your total bill, choose the percentage, and select the number of people. Our online <strong>split bill</strong> calculator does the rest.</p>
        </section>
    </main>
    <script>
        let currentMode = 'bill'; let rawBill = ''; let rawTip = '15'; let rawSplit = '1';
        let tipFresh = true; let splitFresh = true; // true = urmatoarea cifra inlocuieste valoarea implicita, nu o lipeste la coada
        const themeToggle = document.getElementById('themeToggle'); const htmlDoc = document.documentElement;
        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlDoc.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlDoc.setAttribute('data-theme', newTheme);
            themeToggle.innerText = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
        });
        const displayBill = document.getElementById('displayBill'); const displayTip = document.getElementById('displayTip');
        const displaySplit = document.getElementById('displaySplit'); const resTip = document.getElementById('resTip'); const resTotal = document.getElementById('resTotal');
        const tabBill = document.getElementById('tabBill'); const tabTip = document.getElementById('tabTip'); const tabSplit = document.getElementById('tabSplit');
        const rowBill = document.getElementById('rowBill'); const rowTip = document.getElementById('rowTip'); const rowSplit = document.getElementById('rowSplit');

        // Tabs act as mode switch buttons
        [tabBill, tabTip, tabSplit].forEach(tab => {
            tab.addEventListener('click', () => setMode(tab.getAttribute('data-mode')));
        });

        document.querySelectorAll('.keyboard button').forEach(button => {
            button.addEventListener('click', () => { handleInput(button.getAttribute('data-val')); });
        });

        function setMode(mode) {
            currentMode = mode;
            rowBill.classList.toggle('active', mode === 'bill'); rowTip.classList.toggle('active', mode === 'tip'); rowSplit.classList.toggle('active', mode === 'split');
            rowBill.style.borderLeft = mode === 'bill' ? '3px solid var(--primary)' : 'none'; rowTip.style.borderLeft = mode === 'tip' ? '3px solid var(--primary)' : 'none'; rowSplit.style.borderLeft = mode === 'split' ? '3px solid var(--primary)' : 'none';
        }

        function handleInput(val) {
            // Preset tip percentages: set the value but let the user keep editing/typing a custom one afterwards
            if (val.startsWith('t')) {
                rawTip = val.replace('t', '');
                tipFresh = false; // daca revii ulterior la Tip si mai tastezi, rafineaza presetarea (ex: din 15% -> 15.5%)
                setMode('split'); // dupa un procent prestabilit, treci direct la Split
                updateDisplays();
                return;
            }
            if (val === 'C') { rawBill = ''; rawTip = '15'; rawSplit = '1'; tipFresh = true; splitFresh = true; setMode('bill'); updateDisplays(); return; }
            if (val === 'back') {
                if (currentMode === 'bill') rawBill = rawBill.slice(0, -1);
                if (currentMode === 'tip') { rawTip = rawTip.slice(0, -1); if (rawTip === '') tipFresh = true; }
                if (currentMode === 'split') { rawSplit = rawSplit.slice(0, -1); if (rawSplit === '') splitFresh = true; }
                updateDisplays(); return;
            }
            if (currentMode === 'bill') {
                if (val === '.' && rawBill.includes('.')) return;
                if (rawBill.replace('.', '').length >= 7) return;
                rawBill += val;
            } else if (currentMode === 'tip') {
                // Free-form tip entry: allows any custom percentage, including decimals, up to 3 digits
                if (val === '.') { if (!rawTip.includes('.')) rawTip += '.'; tipFresh = false; updateDisplays(); return; }
                rawTip = tipFresh ? val : rawTip + val;
                tipFresh = false;
                if (rawTip.replace('.', '').length > 3) rawTip = rawTip.slice(0, -1);
                if (parseFloat(rawTip) > 100) rawTip = '100';
            } else if (currentMode === 'split') {
                if (val === '.') return;
                rawSplit = splitFresh ? val : rawSplit + val;
                splitFresh = false;
                if (parseInt(rawSplit) > 100) rawSplit = '100';
                if (rawSplit === '0') rawSplit = '1';
            }
            updateDisplays();
        }

        function updateDisplays() {
            const b = parseFloat(rawBill) || 0; const t = parseFloat(rawTip) || 0; const s = parseInt(rawSplit) || 1;
            displayBill.innerText = rawBill ? '$' + rawBill : '$0'; displayTip.innerText = (rawTip || '0') + '%'; displaySplit.innerText = s;
            const totalTip = b * (t / 100); const totalBill = b + totalTip;
            resTip.innerText = '$' + (totalTip / s).toFixed(2); resTotal.innerText = '$' + (totalBill / s).toFixed(2);
        }
    </script>
</body>
</html>
