<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TipSnap - Fast & Easy Tip Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h1 { font-size: 24px; text-align: center; color: #111; margin-bottom: 20px; font-weight: 700; }
    .input-group { margin-bottom: 18px; }
    label { font-size: 14px; font-weight: 600; color: #666; display: block; margin-bottom: 8px; }
    input[type="number"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #e1e5eb; border-radius: 10px; outline: none; transition: border 0.2s; }
    input[type="number"]:focus { border-color: #0066ff; }
    .tip-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .tip-btn { padding: 12px 0; font-size: 15px; font-weight: 600; border: 2px solid #e1e5eb; background: #f8fafc; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tip-btn.active, .tip-btn:hover { background: #0066ff; color: #fff; border-color: #0066ff; }
    .result-box { background: #f8fafc; border-radius: 12px; padding: 16px; margin-top: 20px; border: 1px solid #e1e5eb; }
    .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
    .result-row.total { font-size: 20px; font-weight: 700; color: #0066ff; margin-bottom: 0; padding-top: 10px; border-top: 2px dashed #e1e5eb; }
    
    /* Ad Space / Affiliate Box */
    .ad-space { width: 100%; max-width: 420px; background: #eef2f7; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 16px; text-align: center; font-size: 13px; color: #64748b; }
    .affiliate-link { display: inline-block; margin-top: 8px; color: #0066ff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ TipSnap</h1>
    
    <div class="input-group">
      <label for="bill">Bill Amount ($)</label>
      <input type="number" id="bill" placeholder="0.00" step="0.01">
    </div>

    <div class="input-group">
      <label>Select Tip %</label>
      <div class="tip-buttons">
        <button class="tip-btn active" onclick="selectTip(10, this)">10%</button>
        <button class="tip-btn" onclick="selectTip(15, this)">15%</button>
        <button class="tip-btn" onclick="selectTip(18, this)">18%</button>
        <button class="tip-btn" onclick="selectTip(20, this)">20%</button>
      </div>
      <input type="number" id="customTip" placeholder="Custom Tip %" oninput="calculate()">
    </div>

    <div class="input-group">
      <label for="people">Number of People</label>
      <input type="number" id="people" value="1" min="1">
    </div>

    <div class="result-box">
      <div class="result-row">
        <span>Tip Amount:</span>
        <span id="tipAmount">$0.00</span>
      </div>
      <div class="result-row">
        <span>Total Bill:</span>
        <span id="totalAmount">$0.00</span>
      </div>
      <div class="result-row total">
        <span>Per Person:</span>
        <span id="perPerson">$0.00</span>
      </div>
    </div>
  </div>

  <div class="ad-space" id="adSpace">
    <p>Splitting the bill with friends?</p>
    <a href="#" class="affiliate-link">Send money instantly with Wise / Revolut &rarr;</a>
  </div>

  <script>
    let currentTip = 10; // Default set to 10%

    const billInput = document.getElementById('bill');
    const customTipInput = document.getElementById('customTip');
    const peopleInput = document.getElementById('people');

    billInput.addEventListener('input', calculate);
    peopleInput.addEventListener('input', calculate);

    function selectTip(percent, btn) {
      currentTip = percent;
      customTipInput.value = '';
      document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calculate();
    }

    function calculate() {
      const bill = parseFloat(billInput.value) || 0;
      const people = parseInt(peopleInput.value) || 1;
      let tipPercent = currentTip;

      if (customTipInput.value !== '') {
        tipPercent = parseFloat(customTipInput.value) || 0;
        document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
      }

      const tipTotal = bill * (tipPercent / 100);
      const grandTotal = bill + tipTotal;
      const perPersonTotal = grandTotal / people;

      document.getElementById('tipAmount').innerText = '$' + tipTotal.toFixed(2);
      document.getElementById('totalAmount').innerText = '$' + grandTotal.toFixed(2);
      document.getElementById('perPerson').innerText =
